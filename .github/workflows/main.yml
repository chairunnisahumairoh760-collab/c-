name: Build EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build C++
        run: g++ nama.cpp -o nama.exe -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: nama-exe
          path: nama.exe
